# 自动把上游 looplj/axonhub 的更新合并进我的 myfeature 分支。
#
# 分支分工：
#   unstable  —— 上游的镜子，永远不在上面改东西，只做快进
#   myfeature —— 承载我全部自定义改动，上游更新往这里合
name: Sync Upstream

on:
  schedule:
    # 每天 UTC 04:00 = 新加坡时间 12:00。
    # 放在你白天是为了万一合并失败，你当天能看到邮件而不是几天后才发现。
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  # 要把合并结果推回仓库，所以是 write 不是 read。
  contents: write
  # 合并成功后要调 API 去启动构建 workflow。
  actions: write

concurrency:
  group: sync-upstream
  # 这里故意不取消旧任务：合并到一半被砍掉可能把仓库留在中间状态。
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v7
        with:
          ref: myfeature
          # 0 = 拉完整历史。默认只拉最近 1 个提交，那样根本无法做合并。
          fetch-depth: 0

      - name: 配置提交身份
        # 合并如果产生一个 merge commit，git 需要知道作者是谁，
        # 没配的话这一步会直接报错退出。
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 抓取上游
        # 用 HTTPS 而不是 SSH：只是读公开仓库，不需要密钥，也就不用在 Actions 里存私钥。
        run: |
          git remote add upstream https://github.com/looplj/axonhub.git
          git fetch upstream unstable

      - name: 更新 unstable 镜子分支
        # -B 是「强制把本地 unstable 重置到 origin/unstable」。
        # --ff-only 是「只允许快进」：因为这个分支我们从不手改，它必然能快进；
        # 万一哪天被改过导致不能快进，我宁可这里直接报错，也不要它静静地生成一个奇怪的合并。
        run: |
          git checkout -B unstable origin/unstable
          git merge --ff-only upstream/unstable
          git push origin unstable

      - name: 合并进 myfeature
        id: merge
        run: |
          git checkout myfeature
          BEFORE=$(git rev-parse HEAD)

          if ! git merge --no-edit unstable; then
            # 有冲突：先把仓库恢复到合并前的样子，再让这一步失败。
            # 失败会让整个 workflow 变红并给你发邮件，后面的推送和构建都不会执行。
            # 这就是你选的 fail-closed：宁可不更新，也不推出一个没人看过的镜像。
            git merge --abort
            echo "::error::与上游存在冲突，已放弃本次合并，请在本地手动处理"
            exit 1
          fi

          AFTER=$(git rev-parse HEAD)
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游没有新提交，不需要推送，也不需要重新构建镜像"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 推送 myfeature
        if: steps.merge.outputs.changed == 'true'
        run: git push origin myfeature

      - name: 触发镜像构建
        if: steps.merge.outputs.changed == 'true'
        # 为什么要多这一步：GitHub 有防死循环机制——用仓库自带的 GITHUB_TOKEN
        # 推上去的提交，不会自动触发其它 workflow。
        # 所以合并后必须显式叫一次构建，否则代码更新了但镜像还是旧的。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run my-docker-ghcr.yml --ref myfeature
